name: Deploy to Cloudflare Pages (Staging)

# Manual only. Run this from the Actions tab ("Run workflow"). "Use workflow
# from" just picks which copy of this file to run (leave it on main) — the
# "Branch, tag, or commit to deploy to staging" field below is what actually
# gets checked out and deployed.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to deploy to staging"
        required: true
        default: "main"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      # `pages deploy` can't interactively prompt to create a missing
      # project in CI, so create it first if it doesn't exist yet.
      # continue-on-error lets this step fail harmlessly once the project
      # already exists (Wrangler errors on trying to create a duplicate).
      - name: Ensure Cloudflare Pages project exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create iccfleicester --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # A fixed --branch label (not the actual source ref) so every
          # manual staging run lands on the same staging preview URL,
          # regardless of which branch/tag/commit was deployed.
          command: pages deploy docs --project-name=iccfleicester --branch=staging
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
