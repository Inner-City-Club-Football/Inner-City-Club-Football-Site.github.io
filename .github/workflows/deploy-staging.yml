name: Deploy to Cloudflare Pages (Staging)

# Manual only. Run this from the Actions tab ("Run workflow"). "Use workflow
# from" just picks which copy of this file to run (leave it on main) — the
# "Branch, tag, or commit to deploy to staging" field below is what actually
# gets checked out and deployed.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to deploy to staging"
        required: true
        default: "main"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      # Staging is its own separate Cloudflare Pages project (not a preview
      # branch of the production project), so its own production deploy
      # lands on the clean iccfleicester-staging.pages.dev URL rather than
      # a branch-prefixed preview subdomain.
      # `pages deploy` can't interactively prompt to create a missing
      # project in CI, so create it first if it doesn't exist yet.
      # continue-on-error lets this step fail harmlessly once the project
      # already exists (Wrangler errors on trying to create a duplicate).
      - name: Ensure Cloudflare Pages project exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create iccfleicester-staging --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=main here means "this project's own production branch",
          # giving the clean iccfleicester-staging.pages.dev URL — it does
          # NOT mean "only deploy the main git branch"; the actual source
          # content deployed is whatever ref was checked out above.
          command: pages deploy docs --project-name=iccfleicester-staging --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
