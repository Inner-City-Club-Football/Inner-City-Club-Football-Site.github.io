name: Deploy to Cloudflare Pages (Production)

# Production only deploys when a GitHub Release is published.
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `pages deploy` can't interactively prompt to create a missing
          # project in CI, so create it first if it doesn't exist yet
          # (the `|| true` makes this a no-op once the project exists).
          # --branch marks this deployment as Production in Cloudflare Pages
          # (must match the project's configured production branch name).
          command: |
            pages project create iccf-leicester --production-branch=main || true
            pages deploy docs --project-name=iccf-leicester --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
